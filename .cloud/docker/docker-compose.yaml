services:
  service-dispatcher:
    build:
      context: ../../backend
      dockerfile: services/dispatcher/.cloud/docker/Dockerfile
      target: plugin-dev
      args:
        - PLUGINNAME=dispatcher
        - KIND=services
    image: codeclarityce/service-dispatcher-dev:latest
    restart: always
    volumes:
      - ../../backend:/codeclarity
    depends_on:
      rabbitmq:
        condition: service_healthy
      db:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    env_file:
      - ../../.cloud/env/.env.dev
    environment:
      # Seconds (4h). Literal value: `environment:` ${VAR} interpolation reads
      # the host shell, not the service's env_file.
      - REAPER_STEP_TIMEOUT=14400
      # Other reaper settings keep their defaults: REAPER_INTERVAL,
      # REAPER_IMPORT_RESENDS, RECOVERY_MAX_AGE, STALLED_PLUGIN_GRACE
      # (docs/restart-recovery.md in codeclarity-dev).

volumes:
  projects:
