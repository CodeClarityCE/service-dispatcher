services:
  service-dispatcher:
    build:
      context: ../../backend
      dockerfile: services/dispatcher/.cloud/docker/Dockerfile
      target: plugin-dev
      args:
        - PLUGINNAME=dispatcher
        - KIND=services
    image: codeclarityce/service-dispatcher-dev:latest
    restart: always
    volumes:
      - ../../backend:/codeclarity
    depends_on:
      rabbitmq:
        condition: service_healthy
      db:
        condition: service_started
      adminer:
        condition: service_started
    env_file:
      - ../../.cloud/env/.env.dev
    environment:
      # Seconds (4h). Literal value: `environment:` ${VAR} interpolation reads
      # the host shell, not the service's env_file.
      - REAPER_STEP_TIMEOUT=14400

volumes:
  projects:
